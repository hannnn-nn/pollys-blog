{{ $path := hugo.Data.banner.image | strings.TrimPrefix "/" }}
{{ $src := $path | relURL }}
{{ $file := printf "static/%s" $path }}
{{ if os.FileExists $file }}
  {{ $src = printf "%s?v=%s" $src (os.ReadFile $file | crypto.SHA256) }}
{{ end }}
<div class="banner">
  <img class="banner-image" src="{{ $src }}" alt="{{ hugo.Data.banner.alt }}">
</div>
